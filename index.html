<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Web Animation Experience</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Video Background/Element -->
        <div class="video-container">
            <video autoplay loop muted playsinline id="bg-video">
                <source src="3d model animation.mp4" type="video/mp4">
            </video>
            <div class="video-overlay"></div>
        </div>

        <!-- Main Content -->
        <main class="content">
            <div class="hero-section">
                <h1 class="fade-in">Discover <span>The Future</span></h1>
                <p class="subtitle fade-in delay-1">Explore our 3D animated experience and visit us today.</p>

                <div class="glass-card fade-in delay-2">
                    <div class="location-header">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <h2>AR GRANDS</h2>
                    </div>
                    <p class="address">No 5C/1, Sidco Main Rd, near TNEB,<br>Kodungaiyur (East), Vivekananda
                        Nagar,<br>Chennai – 600118</p>

                    <div class="map-wrapper">
                        <iframe
                            src="https://maps.google.com/maps?q=AR%20GRANDS%20No%205C/1,%20Sidco%20Main%20Rd,%20near%20TNEB,%20Kodungaiyur%20(East),%20Vivekananda%20Nagar,%20Chennai%20%E2%80%93%20600118&t=&z=15&ie=UTF8&iwloc=&output=embed"
                            width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>

                    <a href="https://maps.google.com/maps?q=AR%20GRANDS%20No%205C/1,%20Sidco%20Main%20Rd,%20near%20TNEB,%20Kodungaiyur%20(East),%20Vivekananda%20Nagar,%20Chennai%20%E2%80%93%20600118"
                        target="_blank" class="nav-button">Tap to go Google Map</a>
                </div>
            </div>
        </main>

        <!-- Audio Control -->
        <button id="audio-toggle" class="audio-btn fade-in delay-2" aria-label="Unmute Video">
            <svg id="icon-muted" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
            <svg id="icon-unmuted" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <span>Tap to Unmute</span>
        </button>
    </div>

    <!-- JS for simple interactions -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.fade-in');
            setTimeout(() => {
                elements.forEach(el => el.classList.add('visible'));
            }, 100);

            const video = document.getElementById('bg-video');
            const audioBtn = document.getElementById('audio-toggle');
            const iconMuted = document.getElementById('icon-muted');
            const iconUnmuted = document.getElementById('icon-unmuted');
            const audioText = audioBtn.querySelector('span');

            audioBtn.addEventListener('click', () => {
                if (video.muted) {
                    video.muted = false;
                    iconMuted.style.display = 'none';
                    iconUnmuted.style.display = 'block';
                    audioText.innerText = 'Mute';
                    video.play();
                } else {
                    video.muted = true;
                    iconMuted.style.display = 'block';
                    iconUnmuted.style.display = 'none';
                    audioText.innerText = 'Tap to Unmute';
                }
            });
        });
    </script>
</body>

</html>
