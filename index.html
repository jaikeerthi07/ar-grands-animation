<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR GRANDS Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        #interaction-overlay {
            position: absolute;
            bottom: 2rem;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.4;
            }
        }
    </style>
</head>

<body>
    <video id="bg-video" autoplay muted playsinline>
        <source src="3d model animation.mp4" type="video/mp4">
    </video>
    <div id="interaction-overlay">Tap anywhere for sound</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('bg-video');
            const overlay = document.getElementById('interaction-overlay');
            const mapUrl = "https://maps.google.com/maps?q=AR%20GRANDS%20No%205C/1,%20Sidco%20Main%20Rd,%20near%20TNEB,%20Kodungaiyur%20(East),%20Vivekananda%20Nagar,%20Chennai%20%E2%80%93%20600118";

            // Ensure video attempts to play immediately
            let playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log("Autoplay blocked initially", e);
                });
            }

            // Redirect automatically when video ends
            video.addEventListener('ended', () => {
                window.location.href = mapUrl;
            });

            // Unmute instantly upon any touch
            const unmuteVideo = () => {
                video.muted = false;
                video.play();
                overlay.style.display = 'none'; // Hide the helper text

                // Cleanup listeners
                document.removeEventListener('click', unmuteVideo);
                document.removeEventListener('touchstart', unmuteVideo);
            };

            // Listen for user interaction to enable audio
            document.addEventListener('click', unmuteVideo);
            document.addEventListener('touchstart', unmuteVideo);
        });
    </script>
</body>

</html>
