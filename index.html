<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR GRANDS Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        #interaction-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            color: rgba(255, 255, 255, 0.95);
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: opacity 0.5s ease;
        }

        #interaction-overlay h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            animation: pulse-text 2s infinite;
        }

        #interaction-overlay p {
            font-size: 1rem;
            font-weight: 400;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        @keyframes pulse-text {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0.8;
            }
        }

        .play-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 1.5rem;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <video id="bg-video" autoplay muted playsinline webkit-playsinline preload="auto">
        <source src="baby animate1.mp4" type="video/mp4">
    </video>

    <div id="interaction-overlay">
        <svg class="play-icon" viewBox="0 0 24 24">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <h1>TAP TO START</h1>
        <p>Experience the 3D Animation & Audio</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('bg-video');
            const overlay = document.getElementById('interaction-overlay');
            const mapUrl = "https://maps.google.com/maps?q=AR%20GRANDS%20No%205C/1,%20Sidco%20Main%20Rd,%20near%20TNEB,%20Kodungaiyur%20(East),%20Vivekananda%20Nagar,%20Chennai%20%E2%80%93%20600118";

            // If the video somehow plays natively silently in the background, keep overlay until user taps.
            let playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log("Autoplay strictly blocked.", e);
                });
            }

            // Redirect automatically when video ends
            video.addEventListener('ended', () => {
                window.location.href = mapUrl;
            });

            // Master interaction handler
            const startExperience = () => {
                // Instantly unleash video & audio
                video.muted = false;
                video.currentTime = 0; // Restart from frame 0 to guarantee they don't miss anything!
                video.play();

                // Remove overlay
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 500);

                // Cleanup listeners
                document.removeEventListener('click', startExperience);
                document.removeEventListener('touchend', startExperience);
            };

            // Bind to whole document to ensure it captures
            document.addEventListener('click', startExperience);
            document.addEventListener('touchend', startExperience);
        });
    </script>
</body>

</html>
